version: 0
language: en
settings:
  use-action-bar: false
  per-player-locale: true
messages:
  palette: light
  colors:
    light:
      # Sky blue -> soft lavender
      surface: "#121520"
      surface-alt: "#1E2030"
      primary: "#9CC3FF"
      info: "#6FA8FF"
      accent: "#D9B3FF"
      accent-soft: "#B89BE8"
      muted: "#8C8FA3"
      text: "#D6DAEA"
      neon-primary: "#4A8CFF"
      glow-primary: "#709FFF"
      neon-accent: "#A078E6"
      glow-accent: "#C58FFF"
      night-text: "#E6EAFA"
      quiet: "#8D93AB"
    dark:
      # Deep slate -> luminous lavender
      surface: "#121520"
      surface-alt: "#1E2030"
      primary: "#4A8CFF"
      info: "#709FFF"
      accent: "#A078E6"
      accent-soft: "#C58FFF"
      muted: "#8D93AB"
      text: "#E6EAFA"
      neon-primary: "#4A8CFF"
      glow-primary: "#709FFF"
      neon-accent: "#A078E6"
      glow-accent: "#C58FFF"
      night-text: "#E6EAFA"
      quiet: "#8D93AB"
gui:
  enabled: true
  sneak-right-click-owner: true
audit:
  enabled: true
  retention-days: 90
  recent-per-block: 100
database:
  type: sqlite
  hostname: ""
  database: ""
  username: ""
  password: ""
  prefix: ""
  properties: [ ]
redis:
  enabled: false
  required: false
  # For a shared network use a Redis Sentinel URI, for example:
  # redis-sentinel://sentinel-a:26379,sentinel-b:26379?sentinelMasterId=bolt-master
  # Sentinel mode uses MasterReplica for cache reads/writes and reconnects
  # invalidation Pub/Sub against the current elected master.
  uri: redis://127.0.0.1:6379
  namespace: "bolt:"
  network-id: default
  server-id: standalone
  server-group: default
outbox:
  enabled: true
  interval-ms: 1000
  batch-size: 100
  max-attempts: 8
  lease-ms: 15000
  retry-base-ms: 500
protections:
  private:
    default: true
    require-permission: false
    allows: [ "redstone" ]
  display:
    require-permission: false
    allows: [ "redstone", "interact", "open" ]
  deposit:
    require-permission: false
    allows: [ "redstone", "interact", "open", "deposit", "hopper_insert" ]
  withdrawal:
    require-permission: false
    allows: [ "redstone", "interact", "open", "withdraw", "hopper_extract" ]
  public:
    require-permission: false
    allows: [ "redstone", "interact", "open", "deposit", "withdraw", "hopper_insert", "hopper_extract", "mount" ]
access:
  normal:
    default: true
    require-permission: false
    allows: [ "redstone", "interact", "open", "deposit", "withdraw", "hopper_insert", "hopper_extract", "mount" ]
  admin:
    require-permission: true
    allows: [ "redstone", "interact", "open", "deposit", "withdraw", "hopper_insert", "hopper_extract", "mount", "edit" ]
sources:
  player:
    require-permission: false
  group:
    require-permission: false
  password:
    require-permission: false
  permission:
    require-permission: true
blocks:
  chest:
    autoProtect: private
  trapped_chest:
    autoProtect: private
  '#copper_chests':
    autoProtect: private
  furnace:
    autoProtect: private
  blast_furnace:
    autoProtect: private
  smoker:
    autoProtect: private
  dispenser:
    autoProtect: private
  dropper:
    autoProtect: private
  barrel:
    autoProtect: private
  brewing_stand:
    autoProtect: private
  composter:
    autoProtect: private
  beacon:
    autoProtect: private
  jukebox:
    autoProtect: private
  note_block:
    autoProtect: private
  lectern:
    autoProtect: private
  chiseled_bookshelf:
    autoProtect: private
  hopper:
    autoProtect: private
  decorated_pot:
    autoProtect: private
  crafter:
    autoProtect: private
  '#shulker_boxes':
    autoProtect: private
  '#anvil':
    autoProtect: private
  '#cauldrons':
    autoProtect: private
  '#wooden_shelves':
    autoProtect: private
  ender_chest:
    autoProtect: public
  '#standing_signs':
    autoProtect: false
  '#wall_signs':
    autoProtect: false
  '#all_hanging_signs':
    autoProtect: false
  '#doors':
    autoProtect: false
  '#trapdoors':
    autoProtect: false
  '#fence_gates':
    autoProtect: false
  '#banners':
    autoProtect: false
entities:
  armor_stand:
    autoProtect: private
  item_frame:
    autoProtect: private
  glow_item_frame:
    autoProtect: private
  painting:
    autoProtect: private
  leash_knot:
    autoProtect: private
  acacia_chest_boat:
    autoProtect: private
  bamboo_chest_raft:
    autoProtect: private
  birch_chest_boat:
    autoProtect: private
  cherry_chest_boat:
    autoProtect: private
  dark_oak_chest_boat:
    autoProtect: private
  jungle_chest_boat:
    autoProtect: private
  mangrove_chest_boat:
    autoProtect: private
  oak_chest_boat:
    autoProtect: private
  pale_oak_chest_boat:
    autoProtect: private
  spruce_chest_boat:
    autoProtect: private
  chest_minecart:
    autoProtect: private
  furnace_minecart:
    autoProtect: private
  hopper_minecart:
    autoProtect: private
